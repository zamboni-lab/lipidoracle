VERSION: 1.0.190

# Runnable regression configuration for the public Zenodo-derived OzID pair.
# The compact spectrum contains OzID products only, so its known molecular-
# species parent is supplied by a small attributed reference row.
WORKFLOW:
  lipidoracle: False
  library_extra: ['testdata/ozid/Zenodo_ULSP_PC_17_0_14_1_library.csv']
  stage3: ozid
  rt_check: False

PARAM:
  ncores: 1
  remove_d: False
  ms1_tolerance: 0.02
  ms2_tolerance: 0.02
  ms2_noise_abs: 0
  ms2_noise_prc: 0
  s2_lo_score_cutoff: 0.2
  s2_score_top_cutoff: 0.9
  s3_min_score: 0.2
  s3_min_margin: 0.05
  s3_selection: posterior
  s3_post_credible_level: 0.95
  s3_post_min_mass: 0.5
  s3_post_temperature: 0.01
  ozid_require_complete_pair: True
  ozid_min_complete_pairs: 1
  ozid_formula_mz_tolerance: 0.01
