## LipidOracle parameters
## ---------------------------------------------------------------------------
## This file controls the full annotation pipeline. 
## It's divided in two sections: WORKFLOW (which stages to run) and PARAM (how to run them).
##   - it's safe to edit WORKFLOW for your run
##   - don't edit the PARAM unless you know what you're doing, or are following a published protocol.
## ---------------------------------------------------------------------------
VERSION: 1.0.264

WORKFLOW:
## Targeted analysis (by m/z)
  # Optional CSV with precursor target m/z values (one m/z per line/column).
  # This is useful for focused validation runs and troubleshooting.
  # Leave empty ('') to process all spectra in the MGF.
  mz_target: ''

## Stage 1 and 2
  # Run stages 1 and 2: MS1 accurate-mass matching followed by MS2 matching
  lipidoracle: True

  # the LipiDex and LipidBlast libraries are provided for testing and comparison.
  # many functionalities are not supported with these engines.
  lipidex: False
  lipidblast: False

## Extra reference libraries
  # Optional list of extra CSV/CSV.GZ libraries merged into library search.
  # Paths can be absolute container paths (/data/...) or local relative paths.
  library_extra: [ ] # e.g. '/data/ST501.csv'

  ## Stage 3: optional acyl-chain C=C (+ oxygen site) assignment
  #   False   -> analysis is skipped.
  #   ead1    -> heuristic chain-ladder engine. Skips oxidized species.
  #   ead2    -> exact-formula cleavage engine; required for oxidized lipids
  #              (anything carrying ';O'), which ead1 ignores entirely.
  #   uvpd    -> for 193/213 nm ultraviolet photodissociation data.
  #   oad     -> MS-DIAL-compatible oxygen attachment dissociation profile;
  #              unoxidized only. Pinned/validated against MS-DIAL for PC
  #              [M+H]+, TG [M+NH4]+, SM [M+H]+; PE/PS/PG/PI/PA,
  #              DG/MGDG/DGDG, and Cer/HexCer are supported too but by
  #              unvalidated extrapolation from those three (see
  #              src/stage3_oad.rs).
  #   oad2    -> jointly competes OAD candidates from all Stage-2 parents
  #              for each feature (oad/oad1 remain the OAD1 behavior).
  #   ozid    -> ozone-induced dissociation using paired aldehyde/Criegee
  #              products. See the supported class/adduct profiles below.
  stage3: False

## Retention-time filtering
  # Selects at most one RT-checking engine:
  #   False    -> no RT checking.
  #   liri     -> the default. A monotone
  #               structural-index -> RT map fit independently per lipid
  #               class from the run's own homologous series (plus rt_ref,
  #               aligned onto this run's own RT axis first). Fails to filter
  #               classes for which there are no MS2 spectra to confirm, i.e.
  #               idlevel 1 hits like FA and CE
  #   hydra    -> a cross-class
  #               hydrophobicity model sharing information via headgroup
  #               SMILES fragments, with an absolute + pairwise relative
  #               z-score decision layer. Remove also idlevel 1 hits, but is very conservative
  #   legacy   -> the original two filters (generic formula-based regression
  #               + per-class regression), always run together.
  rt_check: False

  # Optional CSV with reference RTs for external alignment. The file must
  # have columns: hg,c,db,mod,rt.
  # An example is provided in /data/rt_ref_2min.csv. Leave empty ('') to skip external alignment.
  rt_ref: ''

  # Path to an internal-standards CSV file. The bundled EquiSPLASH,
  # LightSPLASH, and UltimateSPLASH CSVs can be used directly; legacy files
  # with name, mass, c, db, mod, and hg columns are also accepted.
  # Change to /data/equisplash.csv or /data/ultimatesplash.csv as needed.
  is_peaks: ''
  
PARAM:
## Performance + matching behavior
  # Number of CPU cores used for MS2 scoring.
  ncores: 6
  
## Library generation  
  # Max allowed rarity index. Lower value = stricter, more conservative IDs.
  # 0 usually means only most common species.
  rarity_max: 3

  # Penalty subtracted from score per rarity unit.
  rarity_penalty: 0.15  

  # Max extra side-chain oxygen considered in MS2 isomer generation.
  ms2_maxO: 2

  # Max extra side-chain oxygen considered in MS1 library generation.
  ms1_maxO: 2

  # Remove deuterated compounds from libraries.
  # This is useful with LipidBlast and LipiDex libraries.
  # Deuterated internal standards should be provided as csv in is_peaks (under WORKFLOW):
  remove_d: False

## Adducts
  # Adduct list considered during library generation and matching.
  adducts: [ '[M+H]+','[M+NH4]+','[M+Na]+','[M+H-H2O]+','[M-H2O+H]+','[M-H]-','[M+Ac-H]-','[M+FA-H]-','[M-2H]2-','[M+HCOO]-' ]
  
  # Relative prior likelihood per adduct (same order as above).
  # Lower values downweight less plausible adduct channels.
  adduct_likelihood: [ 1.0, 1.0, 1.0, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 1 ]

## Input MGF settings
  # If true, neglect mslevel 1 features in the MGF.
  skip_ms1: True

## MS2 peak cleanup before scoring
  # Absolute intensity floor. Peaks below this are discarded.
  ms2_noise_abs: 10

  # Percentile-based intensity floor (0..1). The final threshold is:
  # max(ms2_noise_abs, percentile(ms2_noise_prc)).
  # OzID deliberately ignores this percentile and uses only ms2_noise_abs so
  # the weaker member of a required aldehyde/Criegee pair is not discarded.
  ms2_noise_prc: 0.3

  # Ignore peaks too close to precursor:
  # keep only peaks with mz < precursor_mz - ms2_mztrim.
  # Higher values reduce neutral-loss clutter but can remove informative peaks.
  ms2_mztrim: 5

## MS matching
  # Precursor m/z tolerance for candidate lookup (Da).
  ms1_tolerance: 0.01

  # Fragment m/z tolerance for MS2 peak matching (Da).
  ms2_tolerance: 0.02

  # Score penalty applied per absolute ppm of MS1 mass error.
  ms1_ppm_penalty: 0.03

## Stage 1
  # Minimum absolute MS1 score to keep a candidate.
  s1_lo_score_cutoff: 0.2

  # Relative MS1 cutoff vs best score in same precursor/spectrum context.
  s1_score_top_cutoff: 0.5
  
## Stage 2
  # How a scan's candidate list is cut. 
  #   'legacy'    -> s2_lo_score_cutoff, then s2_score_top_cutoff. 
  #   'posterior' -> softmax credible set
  s2_selection: 'posterior'

  # --- legacy selection only ---
  # Minimum absolute MS2 score to keep a candidate.
  s2_lo_score_cutoff: 0.2

  # Relative MS2 cutoff vs best score in same scan.
  # Example: 0.9 keeps candidates within 90% of scan top score.
  s2_score_top_cutoff: 0.9

  # --- posterior selection only ---
  # Softmax temperature over raw hybrid scores. Lower = sharper.
  s2_post_temperature: 0.06

  # Posterior mass the retained set must reach.
  s2_post_credible_level: 0.95

  # Drop a candidate once its posterior falls below this fraction of the top
  # candidate's, even if the mass target is unmet. 0.125 (1/8) is Royall's
  # "fairly strong evidence" line. 
  s2_post_odds_floor: 0.125

## Resolvability and name convolution
  # OFF for this benchmark: the reported level must follow the arrangement the
  # stage-2 search actually reports. With the collapse on, an arrangement the
  # audit cannot resolve is rewritten to the sum composition and reports idlevel
  # 1; with it off, the chain composition is kept and reported at idlevel 2, and
  # only the unproven sn-order claim is dropped below.
  # If only headgroup evidence is observed for multi-chain lipids, collapse chain-
  # unresolved names to species-level labels to avoid over-specific false detail.
  s2_compress_undefined_chains_to_species: True

  # Report a chain arrangement at species level (PC 34:1 instead of PC 16:0_18:1)
  # when no observed fragment distinguishes it from its best rival arrangement --
  # i.e. its score lead rests only on peaks both arrangements predict. The line
  # above catches the extreme case where nothing but headgroup fragments matched;
  # this catches the common one where a shared chain fragment matched but no
  # discriminating one did. The audit in diag/s2_chain_resolvability.csv is
  # written either way, so the effect can be measured before names change.
  S2_unresolvable_chains_to_species: False

  # Report an unresolvable chain arrangement with its sn-positions stripped
  # (PC 16:0_18:1) instead of asserting one specific, unproven arrangement
  # (PC 16:0/18:1) -- milder than S2_unresolvable_chains_to_species above,
  # which also throws away which chains are present. Ignored when that
  # option is set, since species is the coarser call and wins.
  s2_unresolvable_sn_to_unknown: True

  # Softmax temperature for the chain-isomer posterior in that audit.
  # 1.0 is neutral.
  s2_chain_temperature: 1.0

  # Also write diag/s2_chain_candidates.csv: every scored arrangement with its
  # raw score, which is what the temperature sweep above reads. ~50 rows per
  # audited composition, so off unless you are calibrating.
  s2_chain_dump_candidates: False

  # If True, drop the stage-1 (idlevel 1) row for any spectrum that already
  # carries a stage-2 (idlevel >= 2) identification, so a feature is not
  # reported twice at two levels of detail.
  s2_suppress_idlevel1_if_idlevel2: True

## Stage 3 -- acyl analysis: shared settings (all engines)
  # Stage 3 reports idlevel 3 (all plausible positional candidates) and idlevel 4
  # (the aggregate consensus form); it stays at idlevel 2 where nothing resolves.
  # Every parameter governing stage 3 is prefixed s3_. The generic ones
  # below apply whatever engine WORKFLOW.stage3 selects; s3_legacy_* and
  # s3_post_* below configure the two candidate-selection methods.
  # (The former ead_*/include_ms1_monochain spellings are still accepted.)
  #
  # If True, also run C=C analysis for idlevel 1 single-acyl unsaturated lipids
  # such as LPC/LPE after MS1, IS, cleanup, and RT filtering.
  s3_include_ms1_monochain: True

  # Maximum unsaturation complexity accepted for exhaustive positional search.
  s3_max_unsaturated: 6

  # Maximum total hydroxyl/oxygen positions accepted for exhaustive search.
  # Used by ead2 and uvpd; ead1 has no oxygen support and ignores it.
  s3_max_oxygen: 2

  # Hard cap on candidate enumeration per feature (prevents combinatorial
  # blow-up). A single oxidized chain token (e.g. 20:4;O) enumerates ~22k
  # (db, oh/ket position) candidates, so anything below that stride-samples the
  # true structure out of the search for some isomers before scoring ever runs.
  s3_max_candidates: 100000

  # Intensity transform applied before scoring: none, sqrt/light, log10, ln,
  # or log2. Applies to every engine with an intensity-weighted score term
  # (ead1, ead2, oad, uvpd; ozid has none). Default 'none'.
  s3_intensity_scaling: 'none'

  # ead2 only. Multiplicative penalty applied to a candidate's score per
  # ketone (;oxo) site it asserts, so an oxo hypothesis needs stronger raw
  # fragment support than an isobaric hydroxyl hypothesis to win. 1.0
  # disables the penalty; lower values suppress oxo calls more aggressively.
  # Fitted, not chosen: swept against testdata/oxo-ead (true-oxo/true-diol-OH
  # spectra) and testdata/hete-ead (true-OH only, no oxo). Below 0.85 true
  # oxo is under-called; at 0.95+ false oxo calls start appearing on
  # hete-ead's all-OH data.
  s3_oxo_rarity_prior: 0.85

  # Ead2 only. EXPERIMENTAL, off by default. Gate ead2's posterior-path idlevel-4 double-
  # bond assertion on resolvability -- the same test ead1 already runs, which
  # ead1's history rejected (light-ead precision 86% -> 70%). Measured on
  # hete-ead: assertions 65 -> 22 (-66%), precision 73.8% -> 77.3% (+3.4pp).
  # Opposite direction to ead1's finding but the sample is thin and the recall
  # cost is steep.
  s3_ead2_gate_db_on_resolvability: False

  # Diagnostic: also score chemically impossible (allene) placements as a null,
  # to see where "indistinguishable from impossible" falls. Never emitted as an
  # annotation; adds a null_rel column to diag/s3_resolvability.csv.
  s3_null_decoys: False

  ## OzID acquisition and evidence gates (used only with stage3: ozid)
  # Require the aldehyde and Criegee members of a diagnostic pair. A lone
  # product remains visible in diagnostics but cannot establish a position.
  ozid_require_complete_pair: True
  # Number of complete pairs required before emitting a localized assignment.
  ozid_min_complete_pairs: 1
  # Formula-derived precursor must agree with observed precursor within this
  # absolute tolerance. This prevents unsupported isotope labels from being
  # interpreted with the wrong diagnostic masses.
  ozid_formula_mz_tolerance: 0.01

  # uvpd only. Weight of the chain correlation term in the final idlevel-3 score.
  # Only used by the uvpd engine: ead2 never had a correlation term, and
  # ead1's was dropped when its score became intensity-aware.

  ## Diagnostic output and scoring
  # Max idlevel-3 rows written per feature (diag/annotation_stage3.csv and
  # diag/annotation_full.csv): the reported/credible set, sorted by s3_score
  # and capped here. Caps only what is reported, not the credible set itself
  # or idlevel-4 aggregation.
  s3_output_max: 100

  # How many non-kept candidates past the credible set get appended for
  # context (marked `kept: false` in the output), when the credible set is
  # smaller than s3_output_max. A small fixed pad, not a second cap.
  s3_output_extra: 2

  ## Gate the idlevel-4 assertion
  # Minimum relative gap between the best and second-best candidate,
  # (s1 - s2) / s1 on the raw score scale, before positions are written into
  # the idlevel-4 name. Below it the chain is reported at species level
  # (FA 20:4, not FA 20:4(5,8,11,14)) and the alternatives stay in the
  # confidence tail. Set 0 to name every feature.
  # The engine ships 0.05, fitted against known positions in testdata/ara-ead
  # and testdata/light-ead, where below 0.02 the top call is right 16-23% of
  # the time and above 0.05 it is right 86-97%. Every run deposited here sets
  # 0: the margin compares the reported placement with its best disagreeing
  # rival, which is the question the resolvability audit answers from an
  # observed fragment exclusive to the winner, so a nonzero margin withholds
  # placements the audit has separated without adding evidence where the
  # spectrum is silent. AUTHOR_ACTIONS.md section 3l carries the sweep behind
  # this choice and what it moves in each run. Used by every positional engine.
  s3_min_margin: 0

  # Minimum peaks the winning candidate must have matched before its lead
  # counts as evidence. Guards s3_min_margin, which is relative and so can
  # look decisive when the whole comparison rests on one or two peaks.
  # The engine ships 3; every run deposited here sets 2, so a placement
  # carried by two diagnostic fragments is named.
  s3_min_matched: 2

## Stage 3 -- candidate selection and idlevel-4 naming
  # Which positional isomers are reported, and how confidently idlevel 4 is
  # named. Orthogonal to WORKFLOW.stage3: either method works with any
  # engine.s
  #   posterior -> convert scores to a probability distribution over candidates,
  #                report the smallest set holding s3_post_credible_level of
  #                that probability, and write positions into the idlevel-4
  #                name only when one placement carries at least
  #                s3_post_min_mass. The confidence tail then reports each
  #                position's marginal probability
  #                ("[DB sn1: d5 93%, d14 55%, ...]").
  #   legacy    -> the original method (Wu et al.): report every candidate
  #                scoring within s3_legacy_cutoff of the top one, and name
  #                idlevel 4 where those candidates happen to agree. The tail
  #                reports vote counts over that set, not probabilities.
  #                Accepted as 'cutoff' too, its former name.
  #
  # Which to use: 'legacy' names more features but is right less often.
  # Measured on testdata/hete-ead with ead2, legacy asserts a C=C position on
  # 84 of 96 features and is right on 55 (65%); posterior asserts 55 and is
  # right on 40 (73%).
  s3_selection: 'posterior'

  ## ...when s3_selection: posterior
  # Softmax temperature turning normalized candidate scores into
  # probabilities. Applies to oad/ozid/uvpd only -- ead1 and ead2 use their
  # own fitted fields below, each swept independently
  # (dev/plans_and_fails/l3_temperature_odds_floor_sweep.md).
  s3_post_temperature: 0.01

  # s3_post_temperature, but for ead1 specifically. ead1 gates assertion with
  # its own s3_min_margin/s3_min_matched test independent of the posterior,
  # so idlevel-4 coverage/precision are flat from T=0.03 down to T=0.001;
  # sharper only manufactures false confidence (ECE roughly doubles).
  s3_post_temperature_ead1: 0.03

  # s3_post_temperature, but for ead2 specifically.
  s3_post_temperature_ead2: 0.003

  # Posterior mass the reported credible set must reach.
  s3_post_credible_level: 0.95

  # Likelihood-ratio (support-interval) floor on credible-set membership: a
  # candidate drops out once its own posterior probability falls below this
  # fraction of the top candidate's, even short of s3_post_credible_level.
  # 0.0 disables it -- unchanged legacy behaviour. 0.125 (1/8, Royall's
  # "fairly strong evidence" line) is the fitted value on ead2.
  s3_post_odds_floor: 0.125

  # Minimum posterior mass on a single placement before its positions are
  # written into the idlevel-4 name. Below this the chain is reported at
  # species level (FA 20:4 rather than FA 20:4(5,8,11,14)) -- the positions
  # were never determined, and the confidence tail still lists what is known.
  s3_post_min_mass: 0.5

## ...when s3_selection: legacy
  # How a spectrum's raw, unbounded idlevel-3 scores get rescaled into a
  # reported s3_score. Applies uniformly to every engine (ead1, ead2, oad,
  # uvpd, ozid).
  #   none       -> (default) no rescaling; s3_score is the raw score.
  #   mad        -> log-transform, then floor at median - 1.4826*MAD in
  #                 log-space. Most aggressive at stretching a dominant
  #                 winner away from a tightly clustered field, and robust
  #                 to a single hopeless outlier compressing everyone else.
  #   median-max -> same log-space transform, floor sits exactly at the
  #                 median with no MAD margin, so everything at or below
  #                 the median clamps flat to 0.0.
  #   min-max    -> plain linear min-max, no log transform: floor is simply
  #                 the worst surviving candidate's own raw score. Gentlest
  #                 of the three, and not robust to a single low outlier.
  s3_score_rescaling: 'none'
  
  # Relative score cutoff vs the top candidate.
  s3_legacy_cutoff: 0.99
  
  # Absolute minimum idlevel-3 score to keep a position assignment. 
  s3_legacy_min_score: 0.2

## ead2 only. How the confidence tail reports an aspect with more than one
  # plausible position:
  #   False -> flat, independent per-position marginals ("d10 72%, d15 28%").
  #   True  -> position-tuple alternatives ("d10,d15 25% or d11,d14 18%"),
  #            which keeps positions that rise and fall together legible as
  #            one hypothesis instead of independent coin flips.
  s3_report_position_tuples: False

## RT general
  # Relative to the observed RT-axis length when <= 1; absolute seconds when > 1.
  rt_deviation_cutoff: 0.15

## RT legacy
  rt_legacy_generic_cutoff: 60
  rt_legacy_isigma_cutoff: 0.25
  rt_legacy_minlevel: 2
  # Training gate: only IDs with score >= this value contribute to RT model fit.
  rt_legacy_min_score_training: 0.7
  # Protection gate: IDs with score >= this value can be preserved despite RT deviation.
  rt_legacy_min_score_protection: 0.7
  # Legacy fallback key (used only when split training/protection keys are absent).
  rt_legacy_min_score: 0.7
  # RT split point between lyso and non-lyso classes (seconds).
  rt_legacy_lyso_max: 50
  # Minimum plausible TG RT (seconds).
  rt_legacy_tg_min: 90
  # Duplicate pruning window: for same identity, clusters farther apart than this
  # RT delta are treated as divergent and weaker cluster may be removed.
  rt_legacy_duplicate_max_delta: 4

## LiRI (Lipid Retention Index) model
  # Minimum idlevel that may seed the LiRI model (in-run anchors).
  rt_liri_train_minlevel: 2
  # Minimum idlevel checked against the LiRI model (lower than training on
  # purpose: idlevel-1 calls benefit most from RT screening).
  rt_liri_check_minlevel: 1
  # Training gate: only idlevel>=2 anchors with score >= this value seed the model.
  rt_liri_min_score: 0.7
  # Protection gate: idlevel>=2 IDs with score >= this value survive a "soft"
  # LiRI-specific soft deviation protection. The final generic formula cutoff
  # is applied after the selected RT engine and is not score-protected.
  rt_liri_min_score_protection: 0.7
  # Minimum matched (external anchor, in-run anchor) pairs required before an
  # external rt_ref alignment is trusted at all.
  rt_liri_align_min_inliers: 15
  # Maximum acceptable leave-one-out alignment error (seconds) for rt_ref.
  # Above this the file is judged incompatible and LiRI falls back to anchor-free.
  rt_liri_align_max_loo: 5.0
  # Soft rejection threshold, in standard deviations of the candidate's own
  # calibrated prediction uncertainty.
  rt_liri_z_soft: 1000.0
  # Hard rejection threshold (applies even to score-protected idlevel>=2 IDs).
  rt_liri_z_hard: 1000.0
  # RT reproducibility floor (seconds): minimum prediction sigma.
  rt_liri_jitter_floor: 0.5
  # Minimum anchors in a (class, ether) group before it gets its own local
  # monotone warp and uncertainty estimate.
  rt_liri_min_group_n: 5
  rt_liri_duplicate_max_delta: 4.0

## HYDRA (HYDrophobic Retention Axis) model
  # Training gate: only idlevel>=2 anchors with score >= this value seed the model.
  rt_hydra_anchor_min_score: 0.7
  # Minimum idlevel checked (lower than training on purpose: level-1 calls
  # benefit most from RT screening).
  rt_hydra_check_minlevel: 1
  # Soft rejection threshold (standard deviations of the candidate's own
  # calibrated prediction uncertainty). Unprotected IDs above this are removed
  # (or down-weighted when rt_hydra_llr_weight > 0).
  rt_hydra_z_soft: 3.0
  rt_hydra_z_soft_ms1: 0.75
  # Hard rejection threshold (tiers A/B only, no MS2 chain evidence).
  rt_hydra_z_hard: 5.0
  # Within-precursor competition: drop a tier A/B candidate whose |z| exceeds
  # this while another candidate for the same precursor sits at |z| < 2.
  rt_hydra_z_compete: 4.0
  # Maximum |delta H| (CH2-equivalents) for anchor-neighborhood edges in the
  # pairwise constraint graph.
  rt_hydra_r_max: 8.0
  # Score contribution weight for RT evidence. 0 = filter-only behaviour.
  # >0 turns soft deviations into score penalties instead of deletions.
  rt_hydra_llr_weight: 0.0
  # Minimum total anchors (in-run + aligned external) before HYDRA activates.
  rt_hydra_min_anchors: 24
  # Ridge for the ladder's zero-shot fragment backstop (headgroup fragments
  # -> per-class offset). 3.0 reproduces the validated engine; smaller lets
  # zero-shot classes drift further from the chemistry prior.
  rt_hydra_lambda: 3.0
  rt_hydra_jitter_floor: 0.5
  rt_hydra_duplicate_max_delta: 4.0
  
## LipidBlast class exclusion
  # Headgroup classes to discard when lipidblast=True. These classes produce frequent
  # false positives in the LipidBlast library and should be skipped in routine runs.
  lipidblast_skip: [ 'NAGlySer', 'NAGly', 'LDGCC', 'DGCC', 'NAOrn', 'AHexCer', 'VAE', 'ADGGA' ]

## Debugging and diagnostics
  # Enable verbose diagnostic logging.
  debug: False
  # Deduplication/consistency filtering on MS2 IDs. Disable for debugging.
  ms2id_cleanup: True
  # Deduplication/consistency filtering on MS1 IDs. Disable for debugging.
  ms1_filter: True
  # Emit lipidomics data-quality score columns.
  # See Hoffmann et al, JLR 2025, DOI: 10.1016/j.jlr.2025.100817
  lipidomics_data_quality_scoring: True
